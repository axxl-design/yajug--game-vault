};
const RS = [
  { id: 'banquero', num: '01', name: 'El Banquero', color: '#C99022', fg: '#14110F', quote: 'El dinero siempre manda.', style: 'Juega lento y seguro: acumula efectivo y cobra por todo lo que se mueve en el tablero.', dom: 'Bóveda Central', domDesc: 'Encierra a todos en su bóveda. Durante una vuelta completa, cada pago que haga un rival le deja un 25% extra de comisión.', st: [5, 2, 4, 3] },

  { id: 'abogado', num: '03', name: 'El Abogado', color: '#C13B1F', fg: '#EFE6D2', quote: 'Todo tiene una cláusula.', style: 'Castiga al que va primero: su juicio puede quitarle al líder su mejor propiedad.', dom: 'Tribunal Supremo', domDesc: 'Abre un juicio contra el rival más rico. Si el dado dicta culpable (4 o más), le confisca su propiedad más valiosa.', st: [2, 3, 5, 4] },
  { id: 'corredor', num: '04', name: 'El Corredor', color: '#6B7340', fg: '#EFE6D2', quote: 'Siempre hay un trato.', style: 'Compra barato y vende caro: su remate le arranca propiedades a los rivales a precio de liquidación.', dom: 'Remate Total', domDesc: 'Convierte el tablero en una subasta: obliga a un rival a venderle su mejor propiedad al 60% de su precio.', st: [4, 4, 2, 3] },
  { id: 'coleccionista', num: '05', name: 'El Coleccionista', color: '#C8748A', fg: '#14110F', quote: 'Lo raro vale el doble.', style: 'Junta cartas como trofeos y se queda con las mejores de la mano de los demás.', dom: 'Galería Eterna', domDesc: 'Encierra a los rivales en su galería: cada uno le entrega su mejor carta de la mano, o $100 si no tiene ninguna.', st: [3, 2, 3, 5] },
  { id: 'arquitecto', num: '06', name: 'El Arquitecto', color: '#2A6E70', fg: '#EFE6D2', quote: 'Primero el plano, después el imperio.', style: 'Construye un imperio caro y obliga a todos a pasar por él.', dom: 'Ciudad Infinita', domDesc: 'Reconstruye el tablero a su medida: teletransporta a todos los rivales a su propiedad más cara y les cobra el alquiler.', st: [4, 5, 2, 3] }
];
const LABELS = ['Economía', 'Ataque', 'Defensa', 'Control'];

const LEY = [
  { id: 'alejandro', name: 'Alejandro Magno', yrs: '356–323 a.C.', ep: 'Mundo Clásico', c: '#2A6E70', img: '/assets/ley/alejandro.webp', bio: 'Rey de Macedonia y alumno de Aristóteles. En unos diez años conquistó desde Grecia hasta la India sin perder una batalla importante y fundó Alejandría.', dom: 'Falange Eterna', fx: 'Un muro de escudos rodea a los rivales: le conquistás a cada uno su lugar más barato.' },
  { id: 'freud', name: 'Sigmund Freud', yrs: '1856–1939', ep: 'Era Moderna', c: '#2E3D6E', img: '/assets/ley/freud.webp', bio: 'Neurólogo austríaco y padre del psicoanálisis. Propuso que el inconsciente guía buena parte de lo que hacemos. Vivió en Viena y murió exiliado en Londres.', dom: 'Diván del Inconsciente', fx: 'Todo se vuelve un sueño: cada rival muestra su mano y le sacás una carta.' },
  { id: 'gengis', name: 'Gengis Kan', yrs: 'c. 1162–1227', ep: 'Edad Media', c: '#6B7340', img: '/assets/ley/gengis.webp', bio: 'Unificó a las tribus mongolas y fundó el Imperio mongol, que llegó a ser el imperio continuo más grande de la historia.', dom: 'Estepa sin Fin', fx: 'La horda galopa por el tablero: cada rival te entrega el 20% de su efectivo.' },
  { id: 'isabel', name: 'Isabel I', yrs: '1533–1603', ep: 'Era Imperial', c: '#C13B1F', img: '/assets/ley/isabel.webp', bio: 'Reina de Inglaterra por 44 años. En su reinado su país venció a la Armada Invencible y vivió una edad de oro del teatro y la exploración.', dom: 'Corte Dorada', fx: 'Todos se inclinan: durante una vuelta cada compra rival te paga tributo.' },
  { id: 'leonardo', name: 'Leonardo da Vinci', yrs: '1452–1519', ep: 'Renacimiento', c: '#C8748A', img: '/assets/ley/leonardo.webp', bio: 'Pintor de La Gioconda y La última cena, e inventor que dibujó máquinas voladoras siglos antes de su tiempo.', dom: 'Taller de los Inventos', fx: 'Engranajes gigantes: te llevás una carta del Mercado y construís gratis.' },
  { id: 'napoleon', name: 'Napoleón Bonaparte', yrs: '1769–1821', ep: 'Era Imperial', c: '#C13B1F', img: '/assets/ley/napoleon.webp', bio: 'Militar que llegó a emperador de Francia. Ganó batallas como Austerlitz, creó el Código Civil y terminó exiliado en Santa Elena.', dom: 'Sol de Austerlitz', fx: 'Duelo de dados contra cada rival: el que pierde entrega un lugar.' },
  { id: 'newton', name: 'Isaac Newton', yrs: '1643–1727', ep: 'Era Moderna', c: '#2E3D6E', img: '/assets/ley/newton.webp', bio: 'Físico y matemático inglés. Formuló las leyes del movimiento y la gravitación universal, desarrolló el cálculo y estudió la luz.', dom: 'Gravedad Absoluta', fx: 'Todos caen como manzanas en tu lugar más caro y te pagan el alquiler.' },
  { id: 'tesla', name: 'Nikola Tesla', yrs: '1856–1943', ep: 'Era Moderna', c: '#2E3D6E', img: '/assets/ley/tesla.webp', bio: 'Inventor pionero de la corriente alterna, que hoy alimenta casi toda la electricidad del mundo. Soñó con energía sin cables.', dom: 'Tormenta Eléctrica', fx: 'Rayos en el tablero: tus alquileres se duplican y los rivales pierden carga.' },
  { id: 'mozart', name: 'W. A. Mozart', yrs: '1756–1791', ep: 'Era Imperial', c: '#C13B1F', img: '/assets/ley/mozart.webp', bio: 'Niño prodigio de Salzburgo que daba conciertos a los 6 años. Escribió más de 600 obras, como La flauta mágica.', dom: 'Gran Sinfonía', fx: 'Todos bailan a tu ritmo: cada rival paga $1M por carta en su mano.' },
  { id: 'juana', name: 'Juana de Arco', yrs: 'c. 1412–1431', ep: 'Edad Media', c: '#6B7340', img: '/assets/ley/juana.webp', bio: 'Joven campesina que lideró al ejército francés y levantó el sitio de Orleans en 1429, en la Guerra de los Cien Años.', dom: 'Estandarte de Orleans', fx: 'Escudo de luz: durante una vuelta no pagás alquiler.' },
  { id: 'ramses', name: 'Ramsés II', yrs: 'c. 1303–1213 a.C.', ep: 'Antiguo Egipto', c: '#C99022', img: '/assets/ley/ramses.webp', bio: 'Faraón que reinó 66 años. Levantó templos colosales como Abu Simbel y firmó uno de los primeros tratados de paz conocidos.', dom: 'Eternidad del Nilo', fx: 'El Nilo cruza la ciudad: tus lugares cobran un 50% más por dos vueltas.' }
];
const EPOCAS = [['Antiguo Egipto', '#C99022'], ['Mundo Clásico', '#2A6E70'], ['Edad Media', '#6B7340'], ['Renacimiento', '#C8748A'], ['Era Imperial', '#C13B1F'], ['Era Moderna', '#2E3D6E']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let t = 'dark';
    try { t = localStorage.getItem('yj-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
    this.state = { sel: 1, n: 0, theme: t, lsel: 0, ln: 0 };
  }
  go(i) { this.setState((s) => ({ sel: (i + RS.length) % RS.length, n: s.n + 1 })); }
  renderVals() {
    const r = RS[this.state.sel];
    const sel = { ...r, img: RIMG[r.id], stats: r.st.map((v, k) => ({ label: LABELS[k], v, w: (v / 5) * 100 + '%' })) };
    const L = LEY[this.state.lsel || 0];
    return {
      sel,
      ley: L, leyKey: 'lk' + ((this.state.ln || 0) % 2), leyN: String((this.state.lsel || 0) + 1).padStart(2, '0'),
      leyThumbs: LEY.map((x, k) => ({ ...x, cls: k === (this.state.lsel || 0) ? 'on' : '', pick: () => this.setState({ lsel: k, ln: (this.state.ln || 0) + 1 }) })),
      epocas: EPOCAS.map(([n, c], k) => ({ n, c, k: String(k + 1).padStart(2, '0') })),
      themeCls: this.state.theme === 'light' ? 'light' : '',
      isDark: this.state.theme !== 'light', isLight: this.state.theme === 'light',
      themeLabel: this.state.theme === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro',
      toggleTheme: () => { const t = this.state.theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('yj-theme', t); } catch (e) {} this.setState({ theme: t }); },
      swap: this.state.n % 2 ? 'swapA' : 'swapB',
      cardAnim: this.state.n === 0 ? '' : this.state.n % 2 ? 'cardA' : 'cardB',
      thumbs: RS.map((x, k) => ({ name: x.name, img: RIMG[x.id], cls: k === this.state.sel ? 'on' : '', pick: () => this.go(k) })),
      prev: () => this.go(this.state.sel - 1),
      next: () => this.go(this.state.sel + 1)
    };
  }
}

DCBoot(Component,'tpl');
</script>
