.flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.8,.3,1.1)}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.backf{border-radius:20px;border:2px solid #14110F;background:#C13B1F;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 9px #C13B1F,inset 0 0 0 10.5px #F6EEDC;background-image:repeating-linear-gradient(45deg,rgba(20,17,15,.12) 0 10px,transparent 10px 20px)}

@keyframes dzshake{0%,100%{transform:none}20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-8px,-6px)}80%{transform:translate(6px,6px)}}
.dz-bg{position:absolute;inset:-10%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--dc) 100%,#fff 12%) 0,var(--dc) 38%,color-mix(in srgb,var(--dc) 55%,#000) 100%);clip-path:circle(0% at 50% 50%);animation:dzopen 1s 1.2s cubic-bezier(.7,0,.2,1) forwards}

@keyframes dzdrift{to{transform:translate(120px,120px) rotate(6deg)}}

.rinfo{flex-direction:column;align-items:center;gap:0;padding:6px 12px;color:#EFE6D2;font:inherit;cursor:pointer;min-height:44px;justify-content:center}
.rinfo b{font:800 14px 'Bricolage Grotesque',sans-serif;line-height:1}
.rinfo span{font-size:10px;letter-spacing:.1em;opacity:.75;margin-top:3px;font-weight:700}
.hbtn{position:relative;width:44px;height:44px}
.hbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#C13B1F;color:#EFE6D2;font:800 10px/18px 'DM Sans',sans-serif;font-style:normal}
.hchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.hpanel{pointer-events:auto;align-self:flex-start;width:min(420px,100%);padding:14px;border-radius:24px;background:rgba(20,17,15,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(239,230,210,.16);box-shadow:0 30px 60px -20px rgba(0,0,0,.8);animation:hpin .35s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:30% 0}
@keyframes hpin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.hp-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 10px;border-bottom:1px solid rgba(239,230,210,.1);margin-bottom:6px}
.hp-head b{font:800 16px 'Bricolage Grotesque',sans-serif}.hp-head span{font-size:11px;opacity:.7;text-align:right}
.hp-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:16px}
.hp-row.turn{background:rgba(224,163,58,.12)}
.hp-row img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--c);flex:none}
.hp-id{flex:1;min-width:0}.hp-id b{display:block;font-size:15px}.hp-id span{font-size:12px;opacity:.65}
.hp-bar{margin-top:6px;height:5px;border-radius:3px;background:rgba(239,230,210,.12);overflow:hidden}.hp-bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.hp-num{text-align:right}.hp-num b{display:block;font:800 18px 'Bricolage Grotesque',sans-serif}.hp-num span{display:block;font-size:11px;opacity:.65;white-space:nowrap}
.hp-close{width:100%;margin-top:8px;min-height:44px}
.unclean{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:12px;z-index:30;width:46px;height:46px}
.g.clean .camctl{display:none}
/* --- avisos --- */
.note{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top, 0px));z-index:72;width:min(440px,calc(100% - 24px));transform:translateX(-50%);padding:14px 16px 16px;border-radius:22px;background:#EFE6D2;color:#14110F;box-shadow:0 24px 50px -14px rgba(0,0,0,.6);overflow:hidden;cursor:pointer;animation:ntin .45s cubic-bezier(.2,.9,.3,1.25) both;transition:opacity .25s}
.note.mine{box-shadow:0 0 0 3px #E0A33A,0 24px 50px -14px rgba(0,0,0,.6)}
.note.hush{opacity:0;pointer-events:none}
.g.clean .note{top:calc(70px + env(safe-area-inset-top, 0px))}
@keyframes ntin{from{opacity:0;transform:translate(-50%,-16px) scale(.94)}}
.nt-head{display:flex;align-items:center;gap:12px}
.nt-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:#14110F;color:#E0A33A;font:800 18px 'Bricolage Grotesque',sans-serif}
.nt-head small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.65}
.nt-head b{display:block;font:800 17px/1.15 'Bricolage Grotesque',sans-serif}
.nt-gain{margin-left:auto;padding:6px 12px;border-radius:999px;font:800 16px 'Bricolage Grotesque',sans-serif;white-space:nowrap;animation:gainp .7s .25s cubic-bezier(.2,.9,.3,1.6) both}
.nt-gain.pos{background:#2F6B3A;color:#EFE6D2}.nt-gain.neg{background:#C13B1F;color:#EFE6D2}
@keyframes gainp{from{transform:scale(.3);opacity:0}}
.nt-rows{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.nt-row{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:14px;background:rgba(20,17,15,.07);animation:rowin .4s cubic-bezier(.2,.9,.3,1.2) both}
.nt-row:nth-child(2){animation-delay:.12s}.nt-row:nth-child(3){animation-delay:.24s}.nt-row:nth-child(4){animation-delay:.36s}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}}
.nt-row img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--c)}
.nt-row span{flex:1;font-weight:700;font-size:14px}
.nt-row em{font-style:normal;font:800 14px 'Bricolage Grotesque',sans-serif;padding:3px 10px;border-radius:999px;white-space:nowrap}
.nt-row.paid em{background:#C13B1F;color:#EFE6D2}.nt-row.got em{background:#2F6B3A;color:#EFE6D2}.nt-row.no em{background:#14110F;color:#E0A33A}.nt-row.zero em{background:rgba(20,17,15,.12)}
.nt-text{margin:10px 0 0;font-size:13px;line-height:1.45;opacity:.75}
.nt-toast{margin:0;font-weight:700;font-size:15px;line-height:1.4;text-align:center;padding:2px 4px}
.nt-bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:#E0A33A;transform-origin:0 50%;animation:ntbar linear both}
@keyframes ntbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* --- historial --- */
.hist-bg{position:absolute;inset:0;z-index:74;background:rgba(10,8,7,.45);animation:fade .3s both}
.hist{position:absolute;top:0;right:0;bottom:0;z-index:75;width:min(400px,88%);display:flex;flex-direction:column;background:#1A1512;border-left:1px solid rgba(239,230,210,.14);box-shadow:-30px 0 60px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top, 0px);animation:histin .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes histin{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}
.hist-h{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 12px;border-bottom:1px solid rgba(239,230,210,.1)}.hist-h b{font-size:22px}
.hist-l{flex:1;overflow-y:auto;padding:10px 12px calc(20px + env(safe-area-inset-bottom, 0px));-webkit-overflow-scrolling:touch}
.hx{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-bottom:1px solid rgba(239,230,210,.06)}
.hx-r{flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;opacity:.45;padding-top:4px;width:24px}
.hx-ic{flex:none;width:28px;height:28px;overflow:hidden;font-size:11px !important;border-radius:9px;display:grid;place-items:center;background:rgba(239,230,210,.08);color:#E0A33A;font:800 13px 'Bricolage Grotesque',sans-serif}
.hx b{display:block;font-size:13px;font-weight:600;line-height:1.4}.hx span{display:block;font-size:12px;opacity:.65;margin-top:2px;line-height:1.4}
.hx.mine .hx-ic{background:#E0A33A;color:#14110F}
.dice{z-index:90 !important}
@media (max-width:700px){.pav{width:46px}.pav-a{width:40px;height:40px}.pav-a svg{width:40px;height:40px}.pav-a img{inset:4px;width:32px;height:32px}.pstrip{min-height:48px;padding-right:8px;gap:2px}.hlogo{width:40px;height:40px}.hbtn{width:40px;height:40px}.rinfo{padding:5px 10px;min-height:40px}.note{top:calc(80px + env(safe-area-inset-top, 0px))}.hright{gap:4px}}
@media (max-width:700px){.rinfo,.pchev{display:none !important}.rchip{padding:5px 12px;font-size:10px;letter-spacing:.12em}}
@media (max-width:360px){.hlogo{display:none}}
.yj-coin{position:fixed;z-index:9999;width:24px;height:24px;margin:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE7A6,#E0A33A 55%,#9C6A16);color:#5A3A08;font:800 12px/1 'Bricolage Grotesque',sans-serif;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,240,200,.5);pointer-events:none}.yj-delta{position:fixed;z-index:9999;padding:3px 9px;border-radius:999px;font:800 14px 'Bricolage Grotesque',sans-serif;pointer-events:none;box-shadow:0 6px 14px rgba(0,0,0,.4);white-space:nowrap}.yj-delta.pos{background:#2F6B3A;color:#EFE6D2}.yj-delta.neg{background:#C13B1F;color:#EFE6D2}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>

<style>html,body{margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#14110F;overscroll-behavior:none}#root{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;height:var(--vvh,100dvh)}#root>*{height:100%}#root .g{height:100% !important;min-height:0 !important}</style>
</head>
<body>
<div id="root"></div>
<script type="text/x-tpl" id="tpl">

<div class="g {{gCls}}" style="--lift: {{liftPx}}">

<!-- PICK -->
<sc-if value="{{isPick}}" hint-placeholder-val="{{ true }}">
<main style="position: absolute; inset: 0; overflow: auto">
<div style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px">
<div style="display: flex; justify-content: space-between; align-items: center"><a href="Main.dc.html" aria-label="Volver al inicio" style="display: inline-flex; min-height: 44px; align-items: center"><img src="/assets/iso.png" alt="" style="height: 44px"></a><a class="btn" href="Main.dc.html">Salir</a></div>
<div style="text-align: center; max-width: 720px; margin: 48px auto 60px">
<div class="eyebrow" style="color: #E0A33A">Bienvenido a YAJUGÁ Leyendas</div>
<h1 class="hd" style="margin: 20px 0 0; font-size: clamp(44px, 6vw, 80px)">Elegí tu <span class="serif" style="color: #E0A33A; font-size: 1.08em">leyenda</span></h1>
<p class="muted" style="margin: 24px 0 0; font-size: 18px; line-height: 1.7">Once figuras de la historia, seis épocas y dieciocho maravillas. Comprá, completá épocas, construí, robá pergaminos y cargá tu dominio para atrapar a todos en tu leyenda.</p>
</div>
<sc-if value="{{netOk}}" hint-placeholder-val="{{ false }}">
<div class="online">
<div><div class="eyebrow" style="color: #E0A33A">Jugar con amigos</div><div class="hd" style="font-size: 28px; margin-top: 10px">Armá una sala online</div><p class="muted" style="margin: 10px 0 0; font-size: 15px; line-height: 1.6">De 2 a 4 jugadores. Si son 2, se suma la computadora.</p></div>
<label class="fld"><span>Tu nombre</span><input type="text" maxlength="16" placeholder="Ej: Axel" value="{{fName}}" onInput="{{onName}}"></label>
<sc-if value="{{hasLast}}" hint-placeholder-val="{{ false }}"><button class="btn b-rust" type="button" onClick="{{rejoin}}">Volver a tu partida · {{lastCode}}</button></sc-if>
<div class="onrow"><button class="btn b-rust" type="button" onClick="{{mkRoom}}">Crear sala</button></div>
<div class="onrow"><label class="fld" style="flex: 1"><span>Código de sala</span><input type="text" maxlength="5" placeholder="ABCDE" value="{{fCode}}" onInput="{{onCode}}" style="text-transform: uppercase; letter-spacing: .2em"></label><button class="btn" type="button" onClick="{{joinRoom}}">Unirme</button></div>
</div>
<div class="eyebrow" style="text-align: center; margin: 0 0 24px; opacity: .7">O jugá solo contra la computadora: elegí tu rol</div>
</sc-if>
<sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
<div class="online lobby">
<div style="text-align: center"><div class="eyebrow" style="color: #E0A33A">Sala · {{lob.count}}</div><div class="hd code">{{lob.code}}</div><button class="btn" type="button" onClick="{{copyLink}}">Copiar link de invitación</button><div class="muted" style="margin-top: 10px; font-size: 14px; word-break: break-all">{{lob.msg}}</div><div style="margin-top: 8px; color: #E8705A; font-weight: 700">{{lob.err}}</div></div>
<div class="lplayers"><sc-for list="{{lobPlayers}}" as="lp" hint-placeholder-count="2"><div class="lp" style="--c: {{lp.color}}"><sc-if value="{{lp.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{lp.img}}" alt=""></sc-if><div><b>{{lp.name}}</b><span>{{lp.role}} <em>{{lp.host}}</em></span></div></div></sc-for></div>
<div class="onrow" style="justify-content: center"><sc-if value="{{lob.host}}" hint-placeholder-val="{{ false }}"><button class="btn b-rust" type="button" onClick="{{startRoom}}" disabled="{{lob.startOff}}">{{lob.startTxt}}</button></sc-if><button class="btn" type="button" onClick="{{leaveRoom}}">Salir de la sala</button></div>
<div class="eyebrow" style="text-align: center; opacity: .7">Elegí tu leyenda abajo · cada una solo una vez</div>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="6">
<button class="pick {{r.pcls}}" type="button" onClick="{{r.pick}}" style="--c: {{r.color}}">
<div class="ph"><img src="{{r.img}}" alt="{{r.name}}"></div>
<div style="padding: 22px 24px 26px"><div class="hd" style="font-size: 26px">{{r.name}}</div><div class="eyebrow" style="opacity: .65; margin-top: 6px">{{r.yrs}}</div><div style="font-size: 14px; line-height: 1.55; margin-top: 10px; color: rgba(239,230,210,.85)">{{r.bio}}</div><div class="eyebrow" style="color: #E0A33A; margin-top: 14px">Dominio · {{r.dom}}</div><div class="muted" style="font-size: 14px; line-height: 1.6; margin-top: 8px">{{r.domDesc}}</div></div>
</button>
</sc-for>
</div>
</div>
</main>
</sc-if>

<!-- GAME -->
<sc-if value="{{isGame}}" hint-placeholder-val="{{ false }}">
<div class="stage {{dragCls}}" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerLeave="{{pUp}}" onPointerCancel="{{pUp}}" onWheel="{{wheel}}">
<sc-if value="{{showAura}}" hint-placeholder-val="{{ false }}"><div class="aura dz-{{aura.id}}" style="--dc: {{aura.color}}" aria-hidden="true"><div class="dz-pat"></div></div></sc-if>
<div class="cam">
<div class="world {{dragCls}}" style="transform: translate({{camX}}px, {{camY}}px) scale({{camS}}) translate({{fx}}px, {{fy}}px)">
<div class="board">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="24">
<div class="tl {{t.cls}}" style="grid-column: {{t.col}}; grid-row: {{t.row}}" onClick="{{t.peek}}">
<div class="tbox">
<sc-if value="{{t.isProp}}" hint-placeholder-val="{{ true }}">
<div class="tband" style="background: {{t.color}}; color: {{t.fg}}"><b>{{t.barrio}}</b><span class="hs"><sc-for list="{{t.hs}}" as="h" hint-placeholder-count="0"><i class="{{h.cls}}"></i></sc-for></span></div>
<div class="tname">{{t.name}}</div><div class="tprice"><span>{{t.price}}</span></div>
<sc-if value="{{t.owned}}" hint-placeholder-val="{{ false }}"><div class="flag" style="background: {{t.ownColor}}; color: {{t.ownFg}}">{{t.ownInit}}</div></sc-if>
</sc-if>
<sc-if value="{{t.isCorner}}" hint-placeholder-val="{{ false }}"><div class="cbody"><b>{{t.name}}</b><span>{{t.sub}}</span></div></sc-if>
<sc-if value="{{t.isNews}}" hint-placeholder-val="{{ false }}"><div class="qm">?</div><div class="eyebrow" style="margin-top: 12px">Crónicas</div></sc-if>
</div>
<sc-if value="{{t.img}}" hint-placeholder-val="{{ false }}"><div class="tphoto"><img src="{{t.img}}" alt="{{t.name}}"><div class="pcap"><div class="pk" style="color: {{t.popC}}">{{t.popK}}</div><div class="pn">{{t.name}}</div><sc-if value="{{t.isProp}}" hint-placeholder-val="{{ true }}"><div class="prow"><div>Precio<strong>{{t.price}}</strong></div><div>{{t.popRL}}<strong>{{t.popRV}}</strong></div></div></sc-if><sc-if value="{{t.isCorner}}" hint-placeholder-val="{{ false }}"><div class="prow"><div>Efecto<strong>{{t.sub}}</strong></div></div></sc-if></div></div></sc-if>
</div>
</sc-for>
<div class="mid">
<div class="road"></div>
<sc-for list="{{cars}}" as="c" hint-placeholder-count="0"><div class="car" style="background: {{c.color}}; animation-delay: {{c.delay}}s; animation-duration: {{c.dur}}s"></div></sc-for>
<div class="park">
<div class="pile" style="left: 9%; top: 9%; background: #C13B1F; color: #F6EEDC; transform: rotate(-8deg)"><span class="qm" style="font-size: 64px">?</span><span class="eyebrow">Crónicas</span></div>
<button class="pile deck {{pileCls}}" type="button" onClick="{{drawNow}}" aria-label="Robar cartas del mazo de Pergaminos" style="right: 9%; bottom: 9%; background: #C99022; color: #14110F; transform: rotate(6deg)"><img src="/assets/iso.png" alt="" style="width: 52px"><span class="eyebrow">Pergaminos</span><b class="pgrab">Tocá para robar</b></button>
<div class="plate"><img src="/assets/titulo.png" alt="YAJUGÁ" style="width: 100%; display: block"><div style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 12px"><span style="height: 2px; flex: 1; background: #14110F"></span><span class="hd" style="font-size: 26px; color: #C13B1F; letter-spacing: .02em">LEYENDAS</span><span style="height: 2px; flex: 1; background: #14110F"></span></div></div>
</div>
<div class="cloud" style="top: 8%"></div>
<div class="cloud" style="top: 58%; animation-delay: -30s; animation-duration: 80s"></div>
</div>
</div>
<sc-for list="{{toks}}" as="k" hint-placeholder-count="0"><div class="tok {{k.cls}}" style="left: {{k.x}}px; top: {{k.y}}px; background: {{k.color}}"></div></sc-for>
</div>
</div>
<div class="dice" aria-label="{{diceLabel}}" role="img" style="opacity: {{diceOp}}">
<div class="dw {{toss}}"><div class="die" style="transform: {{d1}}"><div class="fc f1"></div><div class="fc f2"></div><div class="fc f3"></div><div class="fc f4"></div><div class="fc f5"></div><div class="fc f6"></div></div></div>
</div>
</div>

<sc-if value="{{showHud}}" hint-placeholder-val="{{ true }}">
<div class="top hud2">
<div class="hrow">
<a href="Main.dc.html" class="iconbtn hlogo" aria-label="Salir al inicio"><img src="/assets/iso.png" alt="" style="height: 26px"></a>
<button class="cap pstrip" type="button" onClick="{{hudToggle}}" aria-label="Ver jugadores" aria-expanded="{{hudOpenTxt}}">
<sc-for list="{{strip}}" as="p" hint-placeholder-count="3"><span class="pav {{p.cls}}" data-pi="{{p.pi}}" style="--c: {{p.color}}"><span class="pav-a"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(239,230,210,.16)" stroke-width="3"></circle><circle class="ringp" cx="22" cy="22" r="19" fill="none" stroke="{{p.color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="119" style="stroke-dashoffset: {{p.ring}}"></circle></svg><img src="{{p.img}}" alt="{{p.role}}"></span><b>{{p.money}}</b></span></sc-for>
<span class="pchev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>
<div class="hright">
<button class="cap rinfo" type="button" onClick="{{hudToggle}}"><b>{{roundShort}}</b><span>{{playsShort}}</span></button>
<button class="iconbtn hbtn" type="button" onClick="{{histToggle}}" aria-label="Historial de la partida"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><sc-if value="{{hasUnread}}" hint-placeholder-val="{{ false }}"><i class="hbadge">{{unread}}</i></sc-if></button>
<button class="iconbtn hbtn" type="button" onClick="{{cleanToggle}}" aria-label="Limpiar pantalla"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3 4M6.6 6.6C4.3 8 2.7 10.2 2 12c1 2.5 5 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button>
</div>
</div>
<div class="hchips">
<div class="cap eyebrow mob-only rchip">{{roundShort}} · {{playsShort}}</div>
<sc-if value="{{showAura}}" hint-placeholder-val="{{ false }}"><div class="cap eyebrow aurap" style="padding: 6px 12px; font-size: 10px; background: {{aura.color}}; color: {{aura.fg}}">Dominio activo · {{aura.name}} · {{aura.left}}</div></sc-if>
<sc-if value="{{overtime}}" hint-placeholder-val="{{ false }}"><div class="cap eyebrow" style="padding: 6px 12px; font-size: 10px; background: #C13B1F">Tiempo extra · cobros x2</div></sc-if>
</div>
<sc-if value="{{hudOpen}}" hint-placeholder-val="{{ false }}">
<div class="hpanel">
<div class="hp-head"><b>{{roundTxt}}</b><span>{{playsTxt}} · {{deckTxt}}</span></div>
<sc-for list="{{panel}}" as="p" hint-placeholder-count="3">
<div class="hp-row {{p.cls}}" style="--c: {{p.color}}"><img src="{{p.img}}" alt=""><div class="hp-id"><b>{{p.name}}</b><span>{{p.role}}</span><div class="hp-bar"><i style="width: {{p.charge}}%"></i></div></div><div class="hp-num"><b>{{p.money}}</b><span>{{p.props}} lugares · {{p.cards}} cartas</span><span>Dominio {{p.charge}}%</span></div></div>
</sc-for>
<button class="btn hp-close" type="button" onClick="{{hudToggle}}">Cerrar</button>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{isClean}}" hint-placeholder-val="{{ false }}"><button class="iconbtn unclean" type="button" onClick="{{cleanToggle}}" aria-label="Mostrar todo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></sc-if>

<sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
<div class="note {{note.cls}}" role="status" aria-live="polite" onClick="{{noteClose}}">
<sc-if value="{{note.isRes}}" hint-placeholder-val="{{ false }}">
