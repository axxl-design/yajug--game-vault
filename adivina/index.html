body{margin:0;background:#14110F}
.q{position:relative;min-height:100%;height:100%;overflow:auto;background:#14110F;color:#EFE6D2;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 12% 8%,rgba(224,163,58,.14),transparent 40%),radial-gradient(circle at 90% 90%,rgba(42,110,112,.18),transparent 45%)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.home{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#1E1915;border:1px solid rgba(239,230,210,.16)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1.5px solid rgba(239,230,210,.3);background:transparent;color:#EFE6D2;font:700 16px 'DM Sans';cursor:pointer;white-space:nowrap;transition:transform .3s cubic-bezier(.2,.9,.3,1.4),background .2s}

.btn.rust{background:#C13B1F;border-color:#C13B1F;box-shadow:0 6px 0 #7E2412}
.btn.gold{background:#E0A33A;border-color:#E0A33A;color:#14110F;box-shadow:0 6px 0 #8A6213}

.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:48px}
.cat{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:24px;min-height:190px;border-radius:26px;border:0;background:var(--c);color:var(--fg);text-align:left;font:inherit;cursor:pointer;transition:transform .45s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s;box-shadow:0 20px 40px -24px rgba(0,0,0,.8)}
.cat:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 30px 50px -20px rgba(0,0,0,.9)}
.cat .ic{width:52px;height:52px;border-radius:16px;background:rgba(20,17,15,.22);display:flex;align-items:center;justify-content:center}
.cat b{font:800 28px/1 'Bricolage Grotesque';letter-spacing:-.02em;margin-top:auto}
.cat span{font-size:14px;opacity:.85}
.cat .big{position:absolute;right:-14px;bottom:-34px;font:800 130px/1 'Bricolage Grotesque';opacity:.12}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:40px}
.how div{padding:20px;border-radius:20px;background:#1E1915;border:1px solid rgba(239,230,210,.12);font-size:15px;line-height:1.55;color:rgba(239,230,210,.8)}
.how b{display:block;margin-bottom:6px;color:#E0A33A;font:800 16px 'Bricolage Grotesque'}
.bar{height:10px;border-radius:99px;background:rgba(239,230,210,.12);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:#E0A33A;border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}
.who{position:relative;padding:28px;border-radius:30px;background:var(--c);color:var(--fg);overflow:hidden;min-height:420px;box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.who .qm{position:absolute;right:-20px;top:-60px;font:800 280px/1 'Bricolage Grotesque';opacity:.12;pointer-events:none}
.who h2{margin:10px 0 0;font-size:clamp(34px,4.4vw,56px);line-height:1}
.clues{display:flex;flex-direction:column;gap:12px;margin-top:24px;position:relative}
.clue{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:#F6EEDC;color:#14110F;font-size:17px;line-height:1.5;box-shadow:0 6px 0 rgba(20,17,15,.25);animation:deal .6s cubic-bezier(.2,.9,.3,1.3) both}
.clue em{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#14110F;color:#F6EEDC;font:800 14px 'Bricolage Grotesque';font-style:normal}
.clue.locked{background:rgba(20,17,15,.22);color:inherit;box-shadow:none;border:2px dashed rgba(20,17,15,.3);animation:none;opacity:.8}
.clue.locked em{background:rgba(20,17,15,.3)}
@keyframes deal{from{opacity:0;transform:translateY(-30px) rotateX(60deg) scale(.9)}}
.pts{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pts strong{font:800 40px/1 'Bricolage Grotesque'}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:64px;padding:12px 16px;border-radius:18px;border:1.5px solid rgba(239,230,210,.22);background:#1E1915;color:#EFE6D2;font:700 16px/1.25 'DM Sans';text-align:center;cursor:pointer;transition:transform .3s cubic-bezier(.2,.9,.3,1.4),background .2s,border-color .2s}
.opt:hover{transform:translateY(-3px);border-color:#E0A33A}
.opt.bad{background:#3A1A14;border-color:#C13B1F;color:rgba(239,230,210,.5);text-decoration:line-through;pointer-events:none;animation:shake .4s}
.opt.good{background:#2A6E70;border-color:#7FD1C7;color:#F6EEDC;animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
.opt.off{opacity:.35;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.side{display:flex;flex-direction:column;gap:16px}
.reveal{padding:24px;border-radius:24px;background:#1E1915;border:2px solid var(--rc);animation:deal .6s cubic-bezier(.2,.9,.3,1.3)}
.reveal .hd{font-size:34px;margin-top:8px;line-height:1.05}
.stamp{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--rc);color:#F6EEDC;font:800 13px 'Bricolage Grotesque';letter-spacing:.06em;text-transform:uppercase}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.6s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.end{text-align:center;margin-top:clamp(36px,6vw,72px)}
.end .score{font:800 clamp(90px,16vw,180px)/1 'Bricolage Grotesque';color:#E0A33A;letter-spacing:-.05em}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:36px;text-align:left}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;background:#1E1915;border:1px solid rgba(239,230,210,.12);font-weight:700;font-size:15px}

@keyframes fadeup{from{opacity:0;transform:translateY(24px)}}
@media (max-width:820px){.stage{grid-template-columns:1fr}.who{min-height:0}.opts{grid-template-columns:1fr 1fr}.opt{min-height:56px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<body>
<div id="root"></div>
<script type="text/x-tpl" id="tpl">

<div class="q">
<div class="wrap">
<div class="top">
<a class="home" href="Main.dc.html" aria-label="Volver a YAJUGÁ"><img src="/assets/iso.png" alt=""></a>
<sc-if value="{{isPlay}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end"><span class="pill">{{roundTxt}}</span><span class="pill" style="color: #E0A33A">{{score}} pts</span><sc-if value="{{hasStreak}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #C13B1F; border-color: #C13B1F">Racha x{{streak}}</span></sc-if></div></sc-if>
<sc-if value="{{notPlay}}" hint-placeholder-val="{{ true }}"><span class="pill">YAJUGÁ · Juego 03</span></sc-if>
</div>

<!-- HOME -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div class="fade">
<div class="eyebrow" style="text-align: center; color: #E0A33A; margin-top: 48px">10 rondas · 4 pistas · 6 opciones</div>
<h1 class="hd title">¿Quién <span class="serif" style="color: #E0A33A">soy?</span></h1>
<p class="sub">Las pistas aparecen de la más difícil a la más fácil. Cuanto antes adivines, más puntos. Elegí una categoría.</p>
<div class="cats">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button class="cat" type="button" onClick="{{c.go}}" style="--c: {{c.color}}; --fg: {{c.fg}}"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span><b>{{c.name}}</b><span>{{c.desc}}</span><i class="big" aria-hidden="true">?</i></button>
</sc-for>
</div>
<div class="how">
<div><b>1. Leé la pista</b>Arrancás con la más difícil. Si la sabés, arriesgá enseguida: vale 100 puntos.</div>
<div><b>2. Pedí otra si dudás</b>Cada pista nueva baja el premio: 100, 75, 50 y 25 puntos.</div>
<div><b>3. Cuidado con errar</b>Si elegís mal, se tacha esa opción y se revela la siguiente pista.</div>
<div><b>4. Hacé racha</b>Acertar seguido suma 10 puntos extra por cada acierto de la racha.</div>
</div>
</div>
</sc-if>

<!-- PLAY -->
<sc-if value="{{isPlay}}" hint-placeholder-val="{{ false }}">
<div class="bar"><i style="width: {{progress}}"></i></div>
<div class="stage">
<div class="who" style="--c: {{cur.color}}; --fg: {{cur.fg}}">
<div class="qm" aria-hidden="true">?</div>
<div class="eyebrow" style="opacity: .8">{{cur.cat}}</div>
<h2 class="hd">{{cur.prompt}}</h2>
<div class="clues {{dealKey}}">
<sc-for list="{{clues}}" as="k" hint-placeholder-count="4">
<div class="clue {{k.cls}}"><em>{{k.n}}</em><span>{{k.t}}</span></div>
</sc-for>
</div>
<div class="pts"><div><div class="eyebrow" style="opacity: .75">Premio si acertás ahora</div><strong>{{potTxt}}</strong></div>
<sc-if value="{{canMore}}" hint-placeholder-val="{{ true }}"><button class="btn" type="button" onClick="{{more}}" style="border-color: currentColor; color: inherit">Otra pista</button></sc-if>
</div>
<sc-if value="{{showConf}}" hint-placeholder-val="{{ false }}"><div class="conf" aria-hidden="true"><sc-for list="{{conf}}" as="f" hint-placeholder-count="0"><i style="left: {{f.x}}%; background: {{f.c}}; animation-delay: {{f.d}}s"></i></sc-for></div></sc-if>
</div>
<div class="side">
<div class="eyebrow" style="opacity: .7">{{askTxt}}</div>
<div class="opts">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
<button class="opt {{o.cls}}" type="button" onClick="{{o.pick}}">{{o.t}}</button>
</sc-for>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div class="reveal" style="--rc: {{rv.c}}">
<span class="stamp">{{rv.stamp}}</span>
<div class="hd">{{rv.name}}</div>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: rgba(239,230,210,.8)">{{rv.txt}}</p>
<button class="btn gold" type="button" onClick="{{next}}" style="margin-top: 18px; width: 100%">{{nextTxt}}</button>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- END -->
<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<div class="end fade">
<div class="eyebrow" style="color: #E0A33A">{{endCat}} · {{hits}} de 10 aciertos</div>
<div class="score">{{score}}</div>
<div class="hd" style="font-size: clamp(30px, 5vw, 52px); margin-top: 6px">{{rank}}</div>
<p class="sub">{{rankTxt}}</p>
<div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px">
<button class="btn rust" type="button" onClick="{{again}}">Jugar otra vez</button>
<button class="btn" type="button" onClick="{{share}}">{{shareTxt}}</button>
<button class="btn" type="button" onClick="{{toHome}}">Cambiar categoría</button>
</div>
<div class="rows">
<sc-for list="{{log}}" as="r" hint-placeholder-count="10">
<div class="row" style="--rc: {{r.c}}">{{r.name}}<span>{{r.pts}}</span></div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</div>
</script>

  ],
  ciencia: [

    ['Galileo Galilei', 'Estudié el movimiento de los péndulos.', 'Descubrí cuatro lunas de Júpiter.', 'Me juzgaron por defender que la Tierra gira alrededor del Sol.', 'Mejoré el telescopio para observar el cielo.'],

  geo: [

    ['Desierto del Sahara', 'Hace miles de años fui verde y tuve lagos.', 'Ocupo partes de más de diez países.', 'Mis dunas pueden medir cientos de metros.', 'Soy el desierto cálido más grande del mundo.'],

const PTS = [100, 75, 50, 25];
const PROMPT = { historia: '¿Quién soy?', naturaleza: '¿Qué soy?', pop: '¿Quién soy?', deportes: '¿Quién soy?', ciencia: '¿Quién soy?', geo: '¿Qué lugar soy?' };
function shuf(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
class Component extends DCLogic {
  constructor(props) { super(props); this.g = { screen: 'home' }; this.state = { v: 0 }; }
  refresh() { this.setState({ v: Date.now() + Math.random() }); }
  start(cid) {
    const pool = cid === 'mix' ? Object.keys(Q).flatMap((k) => Q[k].map((e) => ({ e, k }))) : Q[cid].map((e) => ({ e, k: cid }));
    const deck = shuf(pool).slice(0, 10);
    this.g = { screen: 'play', cid, deck, i: 0, score: 0, streak: 0, hits: 0, log: [], shared: false };
    this.round();
  }
  round() {
    const g = this.g; const { e, k } = g.deck[g.i];
    const others = shuf(Q[k].filter((x) => x[0] !== e[0]).map((x) => x[0])).slice(0, 5);
    g.r = { e, k, shown: 1, opts: shuf([e[0], ...others]), bad: [], done: false, won: false, pts: 0, deal: 0 };
    this.refresh();
  }
  more() { const r = this.g.r; if (r.done || r.shown >= 4) return; r.shown += 1; r.deal += 1; this.refresh(); }
  pick(t) {
    const g = this.g; const r = g.r; if (r.done || r.bad.includes(t)) return;
    if (t === r.e[0]) {
      r.done = true; r.won = true; g.streak += 1; g.hits += 1;
      r.pts = PTS[r.shown - 1] + (g.streak > 1 ? (g.streak - 1) * 10 : 0); g.score += r.pts;
    } else {
      r.bad.push(t); g.streak = 0;
      if (r.shown < 4) { r.shown += 1; r.deal += 1; } else { r.done = true; r.won = false; }
    }
    if (r.done) g.log.push({ name: r.e[0], pts: r.won ? '+' + r.pts : '0', c: r.won ? '#7FD1C7' : '#E8705A' });
    this.refresh();
  }
  next() { const g = this.g; if (g.i >= 9) { g.screen = 'end'; this.refresh(); return; } g.i += 1; this.round(); }
  renderVals() {
    const g = this.g; const r = g.r; const cat = CATS.find((c) => c.id === (r ? r.k : g.cid)) || CATS[0];
    const base = {
      isHome: g.screen === 'home', isPlay: g.screen === 'play', isEnd: g.screen === 'end', notPlay: g.screen !== 'play',
      cats: CATS.map((c) => ({ ...c, go: () => this.start(c.id) })),
      score: g.score || 0, streak: g.streak || 0, hasStreak: (g.streak || 0) > 1
    };
    if (g.screen === 'play' && r) {
      const clues = r.e.slice(1).map((t, k) => ({ n: k + 1, t: k < r.shown ? t : 'Pista bloqueada', cls: k < r.shown ? '' : 'locked' }));
      Object.assign(base, {
        roundTxt: `Ronda ${g.i + 1}/10`, progress: (g.i / 10) * 100 + '%',
        cur: { color: cat.color, fg: cat.fg, cat: cat.name, prompt: PROMPT[r.k] },
        clues, dealKey: 'd' + r.deal,
        potTxt: r.done ? (r.won ? `+${r.pts}` : '0') : `${PTS[r.shown - 1]} pts`,
        canMore: !r.done && r.shown < 4, more: () => this.more(),
        askTxt: r.done ? 'La respuesta era' : 'Elegí tu respuesta',
        opts: r.opts.map((t) => ({ t, cls: r.done ? (t === r.e[0] ? 'good' : 'off') : r.bad.includes(t) ? 'bad' : '', pick: () => this.pick(t) })),
        done: r.done,
        rv: { c: r.won ? '#2A6E70' : '#C13B1F', stamp: r.won ? (r.shown === 1 ? '¡Con la primera pista!' : '¡Correcto!') : 'Esta vez no', name: r.e[0], txt: r.e[4] },
        next: () => this.next(), nextTxt: g.i >= 9 ? 'Ver resultado' : 'Siguiente',
        showConf: r.done && r.won,
        conf: r.done && r.won ? Array.from({ length: 26 }, (_, k) => ({ x: Math.round(Math.random() * 100), c: ['#E0A33A', '#F6EEDC', '#C13B1F', '#7FD1C7'][k % 4], d: (Math.random() * 0.4).toFixed(2) })) : []
      });
    }
    if (g.screen === 'end') {
      const s = g.score;
      const [rank, rankTxt] = s >= 900 ? ['Mente legendaria', 'Adivinaste casi todo con muy pocas pistas. Nadie te gana en una previa.'] : s >= 650 ? ['Erudito', 'Sabés un montón. Un par de pistas menos y llegás a la cima.'] : s >= 400 ? ['Curioso de primera', 'Buen nivel. Probá otra categoría o volvé a jugar esta.'] : ['Aprendiz', 'Todos empiezan por algún lado. Cada ronda trae personajes distintos.'];
      Object.assign(base, {
        endCat: (CATS.find((c) => c.id === g.cid) || {}).name || '', hits: g.hits, rank, rankTxt, log: g.log,
        again: () => this.start(g.cid), toHome: () => { this.g = { screen: 'home' }; this.refresh(); },
        shareTxt: g.shared ? '¡Copiado!' : 'Copiar resultado',
        share: () => { const t = `Hice ${s} puntos (${g.hits}/10) en ¿Quién soy? de YAJUGÁ, categoría ${(CATS.find((c) => c.id === g.cid) || {}).name}. ¿Me superás? https://yajuga.vercel.app/adivina`; try { navigator.clipboard.writeText(t); } catch (e) {} g.shared = true; this.refresh(); }
      });
    }
    return base;
  }
}
