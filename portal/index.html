<style>
body{margin:0;background:#0E0C14}
.pt{--ink:#14110F;--cream:#EFE6D2;--paper:#F3EAD6;--rust:#C13B1F;--gold:#C99022;--amber:#E0A33A;--teal:#2A6E70;--navy:#2E3D6E;--olive:#6B7340;--pink:#C8748A;--line:rgba(239,230,210,.18);
 position:relative;min-height:100%;height:100%;overflow:auto;background:#0E0C14;color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 background-image:linear-gradient(rgba(239,230,210,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(239,230,210,.03) 1px,transparent 1px);background-size:24px 24px}
.pt *{box-sizing:border-box}
.pt img{image-rendering:pixelated}
.hd{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.02}
.px{font-family:'Silkscreen',monospace;letter-spacing:.05em}
.pb{box-shadow:0 -4px 0 0 var(--bd,#0A0807),0 4px 0 0 var(--bd,#0A0807),-4px 0 0 0 var(--bd,#0A0807),4px 0 0 0 var(--bd,#0A0807)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border:0;cursor:pointer;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--cream);background:var(--rust);text-decoration:none;
 box-shadow:0 -4px 0 0 #0A0807,0 4px 0 0 #0A0807,-4px 0 0 0 #0A0807,4px 0 0 0 #0A0807,inset 0 -5px 0 0 rgba(0,0,0,.28),inset 0 4px 0 0 rgba(255,255,255,.16),5px 8px 0 0 rgba(0,0,0,.45);transition:transform .1s steps(2),filter .15s}
.btn:hover{filter:brightness(1.1);transform:translate(-1px,-3px)}
.btn:active{transform:translate(2px,3px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.green{background:#3E7D3A}.btn.navy{background:var(--navy)}.btn.ghost{background:#211D2C}.btn.dark{background:#0A0807}
.btn:focus-visible,.fld:focus-visible,.tab:focus-visible{outline:3px dashed var(--amber);outline-offset:6px}
/* ---------- pantallas ---------- */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) 20px 40px;text-align:center}
.titlebox{max-width:720px;display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:min(300px,62vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ring::before,.ring::after{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 0deg,#2E3D6E 0 10deg,#4FB3C8 10deg 14deg,#2E3D6E 14deg 30deg);
 -webkit-mask:radial-gradient(circle,transparent 52%,#000 53%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 52%,#000 53%,#000 70%,transparent 71%);animation:spin 9s steps(36) infinite}
.ring::after{inset:16%;animation-direction:reverse;animation-duration:6s;background:repeating-conic-gradient(#C99022 0 8deg,transparent 8deg 20deg)}
.ring .core{position:absolute;inset:30%;background:radial-gradient(circle,#4FB3C8 0 20%,#2E3D6E 60%,#14112A 100%);animation:pulse 2.4s steps(6) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{filter:brightness(1.5)}}
.ring img{position:relative;width:46%;z-index:2;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.5))}
.tt{font-size:clamp(58px,11vw,128px);margin:26px 0 0}
.tt em{font-style:normal;color:#4FB3C8}
.eyebrow{font-family:'Silkscreen',monospace;font-size:13px;letter-spacing:.12em;color:var(--amber)}
.lead{font-size:clamp(17px,2vw,20px);line-height:1.6;color:#CFC6B2;max-width:560px;margin:18px auto 0}
.bullets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:32px 0 0;width:100%;text-align:left}
.bullets div{background:#1A1724;padding:16px;font-size:14px;line-height:1.5;color:#CFC6B2}
.bullets b{display:block;font-family:'Silkscreen',monospace;font-size:12px;color:var(--amber);margin-bottom:6px}
.day-n{font-size:clamp(64px,12vw,140px)}
.newrules{margin:26px auto 0;max-width:560px;text-align:left;background:var(--paper);color:var(--ink);padding:22px 24px;--bd:#0A0807}
.newrules h3{margin:0;font-family:'Silkscreen',monospace;font-size:14px;color:var(--rust)}
.newrules li{margin:10px 0 0;font-size:16px;line-height:1.45}
.newrules ul{margin:6px 0 0;padding-left:20px}
/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) clamp(12px,2vw,24px) 10px;background:rgba(14,12,20,.94);border-bottom:4px solid #0A0807;box-shadow:0 4px 0 0 #262035}
.home{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream)}
.home img{width:26px;height:28px}
.home span{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px}
.chips{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;background:#1A1724;font-family:'Silkscreen',monospace;font-size:13px;box-shadow:0 0 0 3px #0A0807}
.chip b{color:var(--amber);font-weight:700}
.chip.clock b{color:#4FB3C8}
.chip.late{animation:lateb 1s steps(1) infinite}
@keyframes lateb{50%{background:var(--rust)}}
.icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#1A1724;border:0;color:var(--cream);cursor:pointer;box-shadow:0 0 0 3px #0A0807;font-size:16px}
/* ---------- mesa de trabajo ---------- */
.work{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr) minmax(280px,330px);gap:24px;padding:20px clamp(12px,2vw,24px) 120px;max-width:1500px;margin:0 auto}
.booth{display:flex;flex-direction:column;gap:16px}
.window{position:relative;aspect-ratio:1/1;background:#14112A;overflow:hidden;--bd:#0A0807}
.window .vortex{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,#1D1A44 0 12deg,#2E3D6E 12deg 20deg,#1D1A44 20deg 30deg);animation:spin 14s steps(48) infinite;opacity:.9}
.window .glow{position:absolute;inset:18%;background:radial-gradient(circle,rgba(79,179,200,.55),rgba(46,61,110,0) 70%);animation:pulse 3s steps(6) infinite}
.window .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 23%,rgba(10,8,7,.85) 23% 25%);pointer-events:none;z-index:3}
.window .sill{position:absolute;left:0;right:0;bottom:0;height:14%;background:#2B2336;border-top:4px solid #0A0807;z-index:4}
.trav{position:absolute;left:12%;right:12%;bottom:10%;z-index:2;border:0;padding:0;background:none;cursor:pointer}
.trav img{display:block;width:100%;height:auto}
.trav.in{animation:tin .7s steps(7) both}
@keyframes tin{from{transform:translateY(60%);opacity:0}}
.trav.sel img{outline:4px solid var(--amber);outline-offset:-4px}
.empty{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.empty p{margin:0;font-family:'Silkscreen',monospace;font-size:13px;color:#9FB6D8}
.who{display:flex;justify-content:space-between;gap:8px;font-family:'Silkscreen',monospace;font-size:12px;color:#9FB6D8}
.talk{display:flex;flex-direction:column;gap:10px;min-height:60px}
.say{position:relative;background:var(--cream);color:var(--ink);padding:12px 14px;font-size:15px;line-height:1.45;box-shadow:0 0 0 3px #0A0807,4px 5px 0 0 rgba(0,0,0,.4);animation:say .35s steps(4) both}
.say.me{background:#2A2540;color:var(--cream);align-self:flex-end;max-width:90%}
.say small{display:block;font-family:'Silkscreen',monospace;font-size:10px;color:var(--rust);margin-bottom:4px}
.say.me small{color:var(--amber)}
@keyframes say{from{opacity:0;transform:translateY(8px)}}
.choices{display:flex;flex-direction:column;gap:12px}
.choices .btn{min-height:48px;font-size:13px;justify-content:flex-start;text-align:left;line-height:1.3;padding:8px 16px}
.finding{padding:12px 14px;font-size:14px;line-height:1.45;background:#1A1724;box-shadow:0 0 0 3px #0A0807;animation:say .3s steps(3) both}
.finding.hit{background:#4A1B12;box-shadow:0 0 0 3px var(--rust)}
.finding.ok{background:#173226;box-shadow:0 0 0 3px #3E7D3A}
.finding b{display:block;font-family:'Silkscreen',monospace;font-size:11px;margin-bottom:4px;color:var(--amber)}
/* documentos */
.desk{position:relative;min-height:520px;padding:22px;background:#3B2A20;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 46px),linear-gradient(#3B2A20,#2E2018);--bd:#0A0807;align-self:start}
.deskhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.deskhead .px{font-size:12px;color:#E6CFA8}
.today{border:0;cursor:pointer;font-family:'Silkscreen',monospace;font-size:12px;padding:8px 10px;background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px #0A0807}
.today.sel{box-shadow:0 0 0 3px var(--amber),0 0 0 6px #0A0807}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;align-items:start}
.doc{position:relative;background:var(--paper);color:var(--ink);padding:0 0 14px;box-shadow:0 0 0 3px #0A0807,6px 9px 0 0 rgba(0,0,0,.45);animation:docin .45s steps(5) both}
.doc:nth-child(2){animation-delay:.12s}.doc:nth-child(3){animation-delay:.24s}.doc:nth-child(4){animation-delay:.36s}
@keyframes docin{from{opacity:0;transform:translate(-30px,20px) rotate(-4deg)}}
.dochead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--dc,#2E3D6E);color:var(--cream);font-family:'Silkscreen',monospace;font-size:12px}
.docbody{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px}
.photo{border:0;padding:0;background:#C9BFA8;cursor:pointer;box-shadow:0 0 0 3px #0A0807;aspect-ratio:8/9}
.photo img{width:100%;height:100%;display:block}
.photo.sel{box-shadow:0 0 0 3px var(--amber),0 0 0 6px #0A0807}
.seal{margin-top:10px;width:100%;border:0;background:transparent;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(20,17,15,.2)}
.seal img{width:46px;height:46px}
.seal.sel{box-shadow:0 0 0 3px var(--amber)}
.flds{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld{display:block;width:100%;border:0;background:transparent;text-align:left;padding:4px 6px;cursor:pointer;font:inherit;color:var(--ink);border-bottom:2px dotted rgba(20,17,15,.25)}
.fld small{display:block;font-family:'Silkscreen',monospace;font-size:10px;color:#7A6A55;letter-spacing:.06em}
.fld span{display:block;font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.fld:hover{background:rgba(224,163,58,.18)}
.fld.sel{background:var(--amber);box-shadow:0 0 0 3px #0A0807}
.perm{--dc:#3E7D3A}
.perm .docbody{grid-template-columns:minmax(0,1fr)}
.perm .mark{position:absolute;right:12px;bottom:12px;font-size:26px;opacity:.75;filter:grayscale(.2)}
.noteDoc{background:#E9D27A;transform:rotate(-1.5deg);padding:16px 18px 18px;font-size:15px;line-height:1.5}
.noteDoc .px{font-size:11px;color:#6A4A10;margin-bottom:6px}
.scan{--dc:#14112A;background:#1A2235;color:#CFE7EE}
.scan .sil{height:120px;margin:12px;background:repeating-linear-gradient(0deg,rgba(79,179,200,.12) 0 2px,transparent 2px 4px),#0E1626;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #2A4A66;position:relative;overflow:hidden}
.scan .sil::after{content:'';position:absolute;left:0;right:0;height:6px;background:rgba(79,179,200,.7);animation:scanl 1.6s steps(16) infinite}
@keyframes scanl{from{top:0}to{top:100%}}
.scan ul{margin:0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.scan li{font-family:'Silkscreen',monospace;font-size:12px;padding:6px 8px;background:#0E1626}
.nodocs{grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:260px;text-align:center;font-family:'Silkscreen',monospace;font-size:13px;color:#E6CFA8;opacity:.75;padding:20px;line-height:1.6}
.stamp{position:absolute;left:50%;top:40%;z-index:20;transform:translate(-50%,-50%) rotate(-12deg);padding:14px 26px;font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(28px,4vw,46px);letter-spacing:.06em;border:6px solid currentColor;background:rgba(243,234,214,.82);animation:slam .45s steps(4) both;pointer-events:none}
.stamp.ok{color:#2F6B2C}.stamp.no{color:var(--rust)}.stamp.det{color:#14112A}
@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.cite{position:absolute;left:50%;top:-14px;z-index:25;transform:translateX(-50%);width:min(420px,92%);background:#F2C9C0;color:var(--ink);padding:12px 16px;box-shadow:0 0 0 3px #0A0807,6px 8px 0 0 rgba(0,0,0,.5);animation:cite .5s steps(5) both}
.cite b{display:block;font-family:'Silkscreen',monospace;font-size:13px;color:var(--rust)}
.cite p{margin:6px 0 0;font-size:14px;line-height:1.4}
@keyframes cite{from{transform:translate(-50%,-60px);opacity:0}}
.toast{position:fixed;left:50%;bottom:110px;z-index:60;transform:translateX(-50%);background:var(--amber);color:var(--ink);font-family:'Silkscreen',monospace;font-size:13px;padding:12px 16px;box-shadow:0 0 0 3px #0A0807,5px 7px 0 0 rgba(0,0,0,.5);animation:say .3s steps(3) both;max-width:90vw;text-align:center}
/* reglamento */
.rules{background:#1A1724;padding:18px;align-self:start;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;--bd:#0A0807}
.rules h2{margin:0;font-size:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
.tab{border:0;cursor:pointer;font-family:'Silkscreen',monospace;font-size:11px;padding:9px 10px;background:#0E0C14;color:#CFC6B2;box-shadow:0 0 0 2px #0A0807;position:relative}
.tab.on{background:var(--amber);color:var(--ink)}
.tab i{position:absolute;right:-6px;top:-8px;width:12px;height:12px;background:var(--rust);box-shadow:0 0 0 2px #0A0807;animation:lateb 1s steps(1) infinite}
.rlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rlist li{background:#0E0C14;padding:12px;font-size:14px;line-height:1.45;box-shadow:inset 4px 0 0 0 var(--teal)}
.rlist li.new{box-shadow:inset 4px 0 0 0 var(--amber)}
.rlist li em{font-style:normal;font-family:'Silkscreen',monospace;font-size:10px;color:var(--amber);display:block;margin-bottom:3px}
.eras{display:flex;flex-direction:column;gap:8px}
.era{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;background:#0E0C14;padding:8px 10px}
.era img{width:36px;height:36px}
.era b{display:block;font-size:14px}
.era span{font-family:'Silkscreen',monospace;font-size:10px;color:#9FB6D8}
.wanted{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{border:0;cursor:pointer;background:var(--paper);color:var(--ink);padding:8px;text-align:center;box-shadow:0 0 0 3px #0A0807}
.wcard img{width:100%;display:block;box-shadow:0 0 0 2px #0A0807}
.wcard b{display:block;font-family:'Silkscreen',monospace;font-size:10px;margin-top:6px;color:var(--rust)}
.wcard span{display:block;font-size:12px;font-weight:700}
.wcard.sel{box-shadow:0 0 0 3px var(--amber),0 0 0 6px #0A0807}
.hint{font-size:13px;line-height:1.5;color:#9FB6D8;margin:0 0 12px}
/* acciones */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(14,12,20,.96);border-top:4px solid #0A0807;box-shadow:0 -4px 0 0 #262035}
.actions .btn{min-width:150px}
.rbtn{display:none}
/* noche */
.night{max-width:620px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top,0px)) 20px 60px}
.ledger{background:var(--paper);color:var(--ink);padding:22px 22px 18px;margin-top:22px;--bd:#0A0807}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dotted rgba(20,17,15,.25);font-size:16px}
.row b{font-family:'Silkscreen',monospace;font-size:15px}
.row.neg b{color:var(--rust)}.row.pos b{color:#2F6B2C}
.row.total{border-bottom:0;font-weight:700;font-size:18px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px dotted rgba(20,17,15,.25);cursor:pointer;font-size:16px}
.opt input{pointer-events:none;width:22px;height:22px;accent-color:#C13B1F;margin:0 10px 0 0}
.opt label{display:flex;align-items:center;cursor:pointer}
.fam{margin-top:18px;display:flex;gap:12px;align-items:center;background:#1A1724;padding:14px 16px;font-size:15px;line-height:1.45}
.fam b{font-family:'Silkscreen',monospace;font-size:12px;color:var(--amber);display:block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.stats div{background:#1A1724;padding:14px;text-align:center}
.stats b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px}
.stats span{font-family:'Silkscreen',monospace;font-size:10px;color:#9FB6D8}
/* final */
.endcard{max-width:640px;margin:0 auto;background:#1A1724;padding:30px 28px;--bd:var(--ec,#0A0807);text-align:left}
.endcard p{font-size:17px;line-height:1.65;color:#DCD3BF}
@media (max-width:1180px){
 .work{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
 .rules{position:fixed;right:0;top:0;bottom:0;z-index:50;width:min(380px,92vw);max-height:none;transform:translateX(105%);transition:transform .25s steps(5);padding-top:calc(18px + env(safe-area-inset-top,0px))}
 .rules.open{transform:none}
 .rbtn{display:inline-flex}
}
@media (max-width:760px){
 .work{grid-template-columns:1fr;gap:18px;padding-bottom:150px}
 .booth{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px 14px;align-items:start}
 .window{grid-row:1/span 2;aspect-ratio:8/9}
 .trav{left:6%;right:6%}
 .who{grid-column:2;font-size:10px;flex-direction:column;gap:2px}
 .talk{grid-column:2;min-height:0}
 .talk .say{font-size:14px;padding:10px 11px}
 .choices,.finding{grid-column:1/-1}
 .empty .btn{min-height:44px;padding:0 10px;font-size:12px}
 .empty p{font-size:10px}
 .desk{padding:14px}
 .bullets{grid-template-columns:1fr}
 .chips .chip.money span,.chips .chip.day span{display:none}
 .actions{gap:10px}
 .actions .btn{min-width:0;flex:1 1 40%;padding:0 10px;font-size:13px}
 .home span{display:none}
 .stats{grid-template-columns:1fr 1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.pt *{animation:none !important}}
</style>

<div id="root"></div>
<script type="text/x-tpl" id="tpl">
<div class="pt">

<sc-if value="{{isTitle}}" hint-placeholder-val="{{ true }}">
<div class="center"><div class="titlebox">
 <div class="ring"><div class="core"></div><img src="/assets/px/iso.png" alt=""></div>
 <div class="eyebrow" style="margin-top:28px">YAJUGÁ · PROTOTIPO</div>
 <h1 class="hd tt">El <em>Portal</em></h1>
 <p class="lead">Sos el guardia del portal del tiempo. Llegan viajeros de siete épocas y cada uno trae sus papeles. Revisalos, compará los datos y decidí quién pasa. Te pagan 3 créditos por cada viajero bien atendido, y de noche tenés que mantener a tu familia.</p>
 <div class="bullets">
  <div class="pb"><b>REVISÁ</b>Tocá dos datos para compararlos y encontrar errores.</div>
  <div class="pb"><b>SELLÁ</b>Aprobá, denegá o detené. Cada error es una citación.</div>
  <div class="pb"><b>SOBREVIVÍ</b>5 días, reglas nuevas cada día y un secreto detrás del portal.</div>
 </div>
 <div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:38px">
  <button class="btn" type="button" onClick="{{start}}">▶ Empezar turno</button>
  <a class="btn ghost" href="Main.dc.html">Volver</a>
 </div>
</div></div>
</sc-if>

<sc-if value="{{isIntro}}" hint-placeholder-val="{{ false }}">
<div class="center"><div class="titlebox">
 <div class="eyebrow">{{dateLabel}}</div>
 <h1 class="hd day-n" style="margin:14px 0 0">Día {{day}}</h1>
 <p class="lead">{{introText}}</p>
 <div class="newrules pb"><h3>REGLAS NUEVAS</h3><ul><sc-for list="{{newRules}}" as="r" hint-placeholder-count="2"><li>{{r}}</li></sc-for></ul></div>
 <button class="btn" type="button" onClick="{{openDay}}" style="margin-top:34px">▶ Abrir el portal</button>
</div></div>
</sc-if>

<sc-if value="{{isWork}}" hint-placeholder-val="{{ false }}">
<header class="top">
 <a class="home" href="Main.dc.html" aria-label="Volver a YAJUGÁ"><img src="/assets/px/iso.png" alt=""><span>El Portal</span></a>
 <div class="chips">
  <div class="chip day"><span>DÍA</span><b>{{day}}/5</b></div>
  <div class="chip clock {{lateCls}}"><b>{{clock}}</b></div>
  <div class="chip money"><span>CRÉDITOS</span><b>{{money}}</b></div>
  <div class="chip"><span>⚠</span><b>{{citeLabel}}</b></div>
  <button class="icon" type="button" onClick="{{toggleSound}}" aria-label="Sonido">{{soundIcon}}</button>
 </div>
</header>

<div class="work">
 <section class="booth">
  <div class="window pb">
   <div class="vortex"></div><div class="glow"></div>
   <sc-if value="{{hasTrav}}"><button class="trav in {{travSel}}" type="button" onClick="{{pickViajero}}" aria-label="Mirar al viajero"><img src="{{t.face}}" alt="Viajero"></button></sc-if>
   <div class="bars"></div><div class="sill"></div>
   <sc-if value="{{noTrav}}"><div class="empty"><p>{{emptyMsg}}</p><button class="btn gold" type="button" onClick="{{callNext}}" disabled="{{cantCall}}">📢 Siguiente</button></div></sc-if>
  </div>
  <sc-if value="{{hasTrav}}"><div class="who"><span>{{t.eraName}}</span><span>VIAJERO #{{count}}</span></div></sc-if>
  <div class="talk"><sc-for list="{{talk}}" as="m" hint-placeholder-count="2"><div class="say {{m.cls}}"><small>{{m.who}}</small>{{m.text}}</div></sc-for></div>
  <sc-if value="{{hasChoices}}"><div class="choices"><sc-for list="{{choices}}" as="c" hint-placeholder-count="2"><button class="btn {{c.cls}}" type="button" onClick="{{c.go}}">{{c.label}}</button></sc-for></div></sc-if>
  <sc-if value="{{hasFinding}}"><div class="finding {{findCls}}"><b>{{findTitle}}</b>{{findText}}</div></sc-if>
 </section>

 <section class="desk pb">
  <sc-if value="{{hasCite}}"><div class="cite"><b>{{cite.title}}</b><p>{{cite.text}}</p></div></sc-if>
  <div class="deskhead">
   <span class="px">ESCRITORIO · TOCÁ DOS DATOS PARA COMPARAR</span>
   <button class="today {{todaySel}}" type="button" onClick="{{pickHoy}}">HOY: {{todayStr}}</button>
  </div>
  <div class="docs">
   <sc-if value="{{showNoDocs}}"><div class="nodocs">{{noDocsMsg}}</div></sc-if>
   <sc-if value="{{hasPP}}">
   <article class="doc" style="--dc: {{pp.color}}">
    <div class="dochead"><span>PASAPORTE TEMPORAL</span><span>{{pp.eraShort}}</span></div>
    <div class="docbody">
     <div>
      <button class="photo {{selPhoto}}" type="button" onClick="{{pickPhoto}}" aria-label="Foto del pasaporte"><img src="{{pp.photo}}" alt=""></button>
      <button class="seal {{selSeal}}" type="button" onClick="{{pickSeal}}" aria-label="Sello de emisión"><img src="{{pp.seal}}" alt="Sello"></button>
     </div>
     <div class="flds"><sc-for list="{{ppFields}}" as="f" hint-placeholder-count="5"><button class="fld {{f.cls}}" type="button" onClick="{{f.go}}"><small>{{f.label}}</small><span>{{f.val}}</span></button></sc-for></div>
    </div>
   </article>
   </sc-if>
   <sc-if value="{{hasPE}}">
   <article class="doc perm">
    <div class="dochead"><span>PERMISO DE ÉPOCA</span><span>DESTINO: PRESENTE</span></div>
    <div class="docbody"><div class="flds"><sc-for list="{{peFields}}" as="f" hint-placeholder-count="4"><button class="fld {{f.cls}}" type="button" onClick="{{f.go}}"><small>{{f.label}}</small><span>{{f.val}}</span></button></sc-for></div></div>
    <sc-if value="{{pe.mark}}"><span class="mark" title="Marca extraña">⌛</span></sc-if>
   </article>
   </sc-if>
   <sc-if value="{{hasScan}}">
   <article class="doc scan">
    <div class="dochead"><span>ESCÁNER DE AURA</span><span>OBJETOS</span></div>
    <div class="sil"><img src="{{t.face}}" alt="" style="height:100%;filter:grayscale(1) brightness(.5) sepia(1) hue-rotate(160deg);opacity:.6"></div>
    <ul><sc-for list="{{t.items}}" as="it" hint-placeholder-count="3"><li>▸ {{it}}</li></sc-for></ul>
   </article>
   </sc-if>
   <sc-if value="{{hasNote}}">
   <article class="doc noteDoc"><div class="px">NOTA DOBLADA</div>“Somos la Orden del Reloj de Arena. El portal no es una puerta: es una jaula. Si en un permiso ves un reloj ⌛, dejalo pasar aunque sus papeles fallen. Te vamos a recompensar.”</article>
   </sc-if>
  </div>
  <sc-if value="{{hasStamp}}"><div class="stamp {{stampCls}}">{{stampTxt}}</div></sc-if>
 </section>

 <aside class="rules pb {{rulesOpen}}">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="hd">Reglamento</h2><button class="icon rbtn" type="button" onClick="{{toggleRules}}" aria-label="Cerrar">✕</button></div>
  <div class="tabs"><sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3"><button class="tab {{tb.cls}}" type="button" onClick="{{tb.go}}">{{tb.name}}<sc-if value="{{tb.dot}}"><i></i></sc-if></button></sc-for></div>
  <sc-if value="{{tabReglas}}"><ul class="rlist"><sc-for list="{{rulesList}}" as="r" hint-placeholder-count="3"><li class="{{r.cls}}"><em>{{r.tag}}</em>{{r.text}}</li></sc-for></ul></sc-if>
  <sc-if value="{{tabEras}}"><p class="hint">Cada época tiene su sello oficial y su rango de nacimiento válido.</p><div class="eras"><sc-for list="{{eraTable}}" as="e" hint-placeholder-count="7"><div class="era"><img src="{{e.seal}}" alt=""><div><b>{{e.name}}</b><span>NACIDOS: {{e.range}}</span></div></div></sc-for></div></sc-if>
  <sc-if value="{{tabProhib}}"><p class="hint">Objetos que no pueden cruzar el portal. Usá el escáner.</p><ul class="rlist"><sc-for list="{{prohib}}" as="p" hint-placeholder-count="4"><li style="box-shadow:inset 4px 0 0 0 #C13B1F">{{p}}</li></sc-for></ul></sc-if>
  <sc-if value="{{tabBuscados}}"><p class="hint">Si uno de ellos aparece, aunque use otro nombre: DETENER. Tocá su foto para compararla.</p><div class="wanted"><sc-for list="{{wantedList}}" as="w" hint-placeholder-count="4"><button class="wcard {{w.cls}}" type="button" onClick="{{w.go}}"><img src="{{w.face}}" alt=""><b>BUSCADO</b><span>{{w.name}}</span></button></sc-for></div></sc-if>
 </aside>
</div>

<nav class="actions" aria-label="Decisión">
 <button class="btn ghost rbtn" type="button" onClick="{{toggleRules}}">📖 Reglas</button>
 <sc-if value="{{canScan}}"><button class="btn navy" type="button" onClick="{{doScan}}" disabled="{{scanOff}}">⌁ Escanear</button></sc-if>
 <button class="btn" type="button" onClick="{{deny}}" disabled="{{decideOff}}">✕ Denegar</button>
 <sc-if value="{{canDetain}}"><button class="btn dark" type="button" onClick="{{detain}}" disabled="{{decideOff}}">⛓ Detener</button></sc-if>
 <button class="btn green" type="button" onClick="{{approve}}" disabled="{{decideOff}}">✓ Aprobar</button>
</nav>
<sc-if value="{{hasToast}}"><div class="toast">{{toast}}</div></sc-if>
</sc-if>

<sc-if value="{{isNight}}" hint-placeholder-val="{{ false }}">
<div class="night">
 <div class="eyebrow">FIN DEL DÍA {{day}}</div>
 <h1 class="hd" style="font-size:clamp(44px,8vw,76px);margin:12px 0 0">La noche</h1>
 <div class="stats"><div class="pb"><b>{{n.ok}}</b><span>BIEN ATENDIDOS</span></div><div class="pb"><b>{{n.bad}}</b><span>CITACIONES</span></div><div class="pb"><b>{{n.total}}</b><span>VIAJEROS</span></div></div>
 <div class="ledger pb">
  <div class="row"><span>Ahorros</span><b>{{n.prev}}</b></div>
  <div class="row pos"><span>Salario ({{n.ok}} × 3)</span><b>+{{n.salary}}</b></div>
  <sc-if value="{{n.hasBribe}}"><div class="row pos"><span>Soborno</span><b>+{{n.bribe}}</b></div></sc-if>
  <sc-if value="{{n.hasFines}}"><div class="row neg"><span>Multas</span><b>−{{n.fines}}</b></div></sc-if>
  <div class="row neg"><span>Alquiler del puesto</span><b>−{{n.rent}}</b></div>
  <div class="opt" onClick="{{toggleFood}}"><label><input type="checkbox" checked="{{foodPay}}" disabled="{{foodOff}}" tabindex="-1">Comida para tu familia</label><b>−6</b></div>
  <sc-if value="{{n.sick}}"><div class="opt" onClick="{{toggleMed}}"><label><input type="checkbox" checked="{{medPay}}" disabled="{{medOff}}" tabindex="-1">Medicina</label><b>−8</b></div></sc-if>
  <div class="row total"><span>Te quedan</span><b>{{n.final}}</b></div>
 </div>
 <div class="fam pb"><span style="font-size:30px">🏠</span><div><b>TU FAMILIA</b>{{famText}}</div></div>
 <button class="btn" type="button" onClick="{{sleep}}" style="margin-top:30px;width:100%">{{sleepLabel}}</button>
</div>
</sc-if>

<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<div class="center"><div class="titlebox" style="max-width:680px">
 <div class="eyebrow">{{end.tag}}</div>
 <h1 class="hd" style="font-size:clamp(46px,8vw,86px);margin:14px 0 24px">{{end.title}}</h1>
 <div class="endcard pb" style="--ec: {{end.color}}"><sc-for list="{{end.text}}" as="p" hint-placeholder-count="2"><p>{{p}}</p></sc-for></div>
 <div class="stats" style="width:100%;max-width:640px"><div class="pb"><b>{{fin.days}}</b><span>DÍAS</span></div><div class="pb"><b>{{fin.ok}}</b><span>BIEN ATENDIDOS</span></div><div class="pb"><b>{{fin.money}}</b><span>CRÉDITOS</span></div></div>
 <p class="lead" style="font-size:15px">Finales encontrados: {{endsFound}} de 7</p>
 <div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:24px">
  <button class="btn" type="button" onClick="{{start}}">↻ Jugar de nuevo</button>
  <a class="btn ghost" href="Main.dc.html">Volver a YAJUGÁ</a>
 </div>
</div></div>
</sc-if>

</div>
</script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="/dc.js"></script>

<script src="/sfx.js"></script>
<script>

/* ===================== EL PORTAL — prototipo ===================== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const SKIN = ['#F1C9A5', '#E0AC86', '#C68863', '#9C6644', '#6E4630'];
const HAIR = ['#1B1410', '#4A2E1C', '#8A5A2B', '#C9A25E', '#B8B2A6', '#8E2F1D'];
const svgURI = (w, h, body) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${body}</svg>`);
const r = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const ERAS = [
  { id: 'egipto', name: 'Antiguo Egipto', short: 'EGIPTO', range: [-1500, -1050], shape: 'tri', color: '#C99022', cloth: '#E8DCC0', bg: '#C9A25E', first: ['Neferu', 'Amenhotep', 'Merit', 'Kha', 'Tuya', 'Paser', 'Nebet', 'Senu'], sur: ['de Tebas', 'de Menfis', 'de Abydos', 'del Nilo'], greet: ['Que Ra ilumine tu jornada, guardián.', 'Vengo de muy lejos… más lejos de lo que imaginás.'] },
  { id: 'roma', name: 'Roma Antigua', short: 'ROMA', range: [-100, 150], shape: 'circ', color: '#C13B1F', cloth: '#EFE6D2', bg: '#B5806A', first: ['Livia', 'Marco', 'Julia', 'Cayo', 'Octavia', 'Lucio', 'Flavia', 'Tito'], sur: ['Drusa', 'Valerio', 'Cornelia', 'Antonio', 'Claudia', 'Fabio'], greet: ['Ave, guardia. ¿Es aquí la fila?', 'Por Júpiter, qué lugar tan extraño.'] },
  { id: 'medieval', name: 'Edad Media', short: 'MEDIEVAL', range: [1100, 1400], shape: 'sq', color: '#6B7340', cloth: '#6B5440', bg: '#5D6B4E', first: ['Ermengol', 'Blanca', 'Rodrigo', 'Urraca', 'Sancho', 'Elvira', 'Tomás', 'Inés'], sur: ['de Burgos', 'de Castilla', 'el Pardo', 'de León', 'de Aragón'], greet: ['Dios os guarde, señor.', 'Traigo mis papeles en regla, o eso me juraron.'] },
  { id: 'renac', name: 'Renacimiento', short: 'RENACIM.', range: [1450, 1600], shape: 'dia', color: '#C8748A', cloth: '#7A2E4A', bg: '#A8778A', first: ['Lorenzo', 'Caterina', 'Sandro', 'Lucrezia', 'Piero', 'Beatrice', 'Giulia'], sur: ['de Florencia', 'Sforza', 'Bellini', 'Rossi', 'Conti'], greet: ['Buongiorno. Vengo a ver el futuro.', '¿Es cierto que acá pintan con luz?'] },
  { id: 'imperial', name: 'Era Imperial', short: 'IMPERIAL', range: [1750, 1880], shape: 'star', color: '#2E3D6E', cloth: '#2E3D6E', bg: '#6E7A9A', first: ['Josefina', 'Étienne', 'Amalia', 'Benito', 'Carlota', 'Ramón', 'Adela'], sur: ['Duval', 'Montero', 'Lacroix', 'Ibarra', 'Vidal'], greet: ['Buenas tardes, monsieur.', 'Apúrese, mi carruaje no espera.'] },
  { id: 's20', name: 'Siglo XX', short: 'SIGLO XX', range: [1900, 1990], shape: 'hex', color: '#2A6E70', cloth: '#5A6B5A', bg: '#7FA39A', first: ['Rosa', 'Ernesto', 'Delia', 'Aníbal', 'Marta', 'Julio', 'Elsa'], sur: ['Benítez', 'Gómez', 'Acosta', 'Ruiz', 'Ferreira'], greet: ['Hola, ¿tarda mucho esto?', 'Tengo una cita en 2126, no me haga perderla.'] },
  { id: 'futuro', name: 'Año 2300', short: 'AÑO 2300', range: [2250, 2330], shape: 'ring', color: '#4FB3C8', cloth: '#1F2A3A', bg: '#3A5A70', first: ['Kai', 'Nova', 'Zed', 'Lumi', 'Orion', 'Vega', 'Ixa'], sur: ['K-7', 'Solari', 'Unit-3', 'Neon', 'Arkos'], greet: ['Saludos, unidad humana.', 'Qué primitivo todo. Me encanta.'] }
];
const SHAPES = ['tri', 'circ', 'sq', 'dia', 'star', 'hex', 'ring'];
function sealSVG(shape, color) {
  const P = {
    tri: [[5, 1, 2, 1], [4, 2, 4, 1], [4, 3, 4, 1], [3, 4, 6, 1], [3, 5, 6, 1], [2, 6, 8, 1], [2, 7, 8, 1], [1, 8, 10, 1], [1, 9, 10, 1]],
    circ: [[4, 1, 4, 1], [2, 2, 8, 1], [1, 3, 10, 6], [2, 9, 8, 1], [4, 10, 4, 1]],
    sq: [[2, 2, 8, 8]],
    dia: [[5, 1, 2, 1], [4, 2, 4, 1], [3, 3, 6, 1], [2, 4, 8, 1], [1, 5, 10, 2], [2, 7, 8, 1], [3, 8, 6, 1], [4, 9, 4, 1], [5, 10, 2, 1]],
    star: [[5, 0, 2, 3], [0, 3, 12, 2], [2, 5, 8, 2], [2, 7, 3, 3], [7, 7, 3, 3], [1, 10, 2, 1], [9, 10, 2, 1]],
    hex: [[3, 1, 6, 1], [2, 2, 8, 1], [1, 3, 10, 6], [2, 9, 8, 1], [3, 10, 6, 1]],
    ring: [[4, 1, 4, 1], [2, 2, 8, 1], [1, 3, 3, 6], [8, 3, 3, 6], [2, 9, 8, 1], [4, 10, 4, 1]]
  }[shape];
  return svgURI(12, 12, P.map(([x, y, w, h]) => r(x, y, w, h, color)).join('') + r(5, 5, 2, 2, 'rgba(20,17,15,.35)'));
}
function newFace(era) {
  return { era: era.id, skin: R(0, 4), hair: R(0, 5), style: R(0, 3), beard: Math.random() < 0.28, glasses: Math.random() < 0.18, eyes: R(0, 1), mouth: R(0, 2) };
}
function mutateFace(f) {
  const g = { ...f }; const k = R(0, 2);
  if (k === 0) g.hair = (f.hair + R(2, 4)) % 6;
  else if (k === 1) { g.style = (f.style + R(1, 3)) % 4; g.hair = (f.hair + 3) % 6; }
  else { g.beard = !f.beard; g.skin = (f.skin + 2) % 5; }
  return g;
}
function faceSVG(f) {
  const era = ERAS.find((e) => e.id === f.era) || ERAS[0];
  const S = SKIN[f.skin], SD = 'rgba(0,0,0,.18)', H = HAIR[f.hair], K = '#14110F';
  let b = r(0, 0, 16, 18, era.bg) + r(0, 12, 16, 6, 'rgba(0,0,0,.12)');
  b += r(2, 14, 12, 4, era.cloth) + r(6, 14, 4, 1, 'rgba(0,0,0,.25)');
  b += r(7, 12, 2, 2, S) + r(7, 12, 2, 1, SD);
  b += r(4, 4, 8, 9, S) + r(3, 7, 1, 2, S) + r(12, 7, 1, 2, S);
  b += r(4, 4, 1, 1, era.bg) + r(11, 4, 1, 1, era.bg) + r(4, 12, 1, 1, era.bg) + r(11, 12, 1, 1, era.bg);
  // pelo
  if (f.style === 0) b += r(4, 3, 8, 2, H) + r(4, 5, 1, 2, H) + r(11, 5, 1, 2, H);
  if (f.style === 1) b += r(4, 3, 8, 2, H) + r(3, 4, 1, 9, H) + r(12, 4, 1, 9, H) + r(4, 5, 1, 1, H) + r(11, 5, 1, 1, H);
  if (f.style === 3) b += r(4, 2, 8, 3, H) + r(3, 3, 10, 2, H) + r(3, 5, 1, 2, H) + r(12, 5, 1, 2, H);
  // cara
  b += r(5, 7, 2, 1, H) + r(9, 7, 2, 1, H);
  b += f.eyes ? r(5, 8, 2, 1, K) + r(9, 8, 2, 1, K) : r(6, 8, 1, 1, K) + r(9, 8, 1, 1, K);
  b += r(7, 10, 2, 1, SD);
  if (f.beard) b += r(4, 10, 1, 2, H) + r(11, 10, 1, 2, H) + r(5, 11, 6, 2, H) + r(7, 11, 2, 1, '#7A2E2A');
  else b += f.mouth === 0 ? r(6, 11, 4, 1, '#7A2E2A') : f.mouth === 1 ? r(7, 11, 2, 1, '#7A2E2A') : r(6, 11, 4, 1, '#7A2E2A') + r(6, 10, 1, 1, '#7A2E2A') + r(9, 10, 1, 1, '#7A2E2A');
  if (f.glasses) b += r(5, 8, 2, 1, '#9FB6D8') + r(9, 8, 2, 1, '#9FB6D8') + r(7, 8, 2, 1, K) + r(4, 8, 1, 1, K) + r(11, 8, 1, 1, K);
  // tocado según época
  const id = era.id;
  if (id === 'egipto') b += r(3, 3, 10, 2, '#C99022') + r(3, 4, 10, 1, '#2E3D6E') + r(2, 5, 2, 8, '#C99022') + r(12, 5, 2, 8, '#C99022') + r(2, 7, 2, 1, '#2E3D6E') + r(12, 7, 2, 1, '#2E3D6E') + r(2, 10, 2, 1, '#2E3D6E') + r(12, 10, 2, 1, '#2E3D6E');
  if (id === 'roma') b += r(4, 3, 8, 1, '#6B7340') + r(3, 4, 1, 1, '#6B7340') + r(12, 4, 1, 1, '#6B7340') + r(5, 2, 1, 1, '#8A9A50') + r(10, 2, 1, 1, '#8A9A50') + r(2, 14, 4, 4, '#C13B1F');
  if (id === 'medieval') b += r(3, 2, 10, 2, '#5A4632') + r(2, 3, 2, 11, '#5A4632') + r(12, 3, 2, 11, '#5A4632') + r(4, 4, 8, 1, '#5A4632');
  if (id === 'renac') b += r(3, 2, 10, 2, '#C13B1F') + r(11, 1, 3, 1, '#C13B1F') + r(12, 0, 1, 1, '#E0A33A');

    const C = (k) => (sel.indexOf(k) >= 0 ? 'sel' : '');
    const hh = Math.floor((s.clock || 360) / 60), mm = (s.clock || 360) % 60;
    const pp = t && t.docs ? { color: t.era.color, eraShort: t.era.short, photo: t.photo, seal: t.seal } : {};
    const ppFields = t && t.docs ? [['pp.nombre', 'NOMBRE', t.name], ['pp.epoca', 'ÉPOCA DE ORIGEN', t.era.name], ['pp.nac', 'NACIMIENTO', ystr(t.born)], ['pp.num', 'Nº PASAPORTE', t.num], ['pp.vence', 'VENCE', dstr(t.vence)]].map(([k, label, val]) => ({ label, val, cls: C(k), go: F(k) })) : [];
    const peFields = t && t.pe ? [['pe.nombre', 'TITULAR', t.pe.name], ['pe.num', 'Nº PASAPORTE', t.pe.num], ['pe.motivo', 'MOTIVO', t.special === 'archivista' ? 'Devolver lo que es nuestro' : 'Turismo temporal'], ['pe.vence', 'VÁLIDO HASTA', dstr(t.pe.vence)]].map(([k, label, val]) => ({ label, val, cls: C(k), go: F(k) })) : [];
    const tabsDef = [['reglas', 'REGLAS', 1], ['eras', 'ÉPOCAS', 2], ['prohib', 'PROHIBIDOS', 4], ['buscados', 'BUSCADOS', 5]].filter((x) => d >= x[2]);
    const seen = s.seenTabs || {};
    const n = s.screen === 'night' ? this.nightCalc() : {};
    const famText = { bien: 'Están bien. Cenaron y duermen tranquilos.', hambre: 'Tienen hambre. Si mañana tampoco comen, se van a enfermar.', enfermos: 'Están enfermos. Necesitan medicina esta noche.' }[s.fam || 'bien'];
    const E = s.end ? ENDS[s.end] : { tag: '', title: '', text: [], color: '#000' };
    const decideOff = !t || !!s.stamp || t.special === 'supervisor';
    return {
      isTitle: s.screen === 'title', isIntro: s.screen === 'intro', isWork: s.screen === 'work', isNight: s.screen === 'night', isEnd: s.screen === 'end',
      start: () => this.start(), openDay: () => this.openDay(), day: d,
      dateLabel: dstr(d), introText: INTRO[d], newRules: RULES.filter((x) => x.d === d).map((x) => x.text),
      clock: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'), lateCls: s.closing ? 'late' : '',
      money: s.money, citeLabel: (s.cites || 0) + '/2',
      soundIcon: (window.YJS && window.YJS.isOn && !window.YJS.isOn()) ? '🔇' : '🔊', toggleSound: () => { if (window.YJS) window.YJS.toggle(); this.setState({}); },
      hasTrav: !!t, noTrav: !t, t: t || {}, count: s.count, travSel: C('viajero'), pickViajero: F('viajero'),
      emptyMsg: s.closing ? 'Hora de cierre. El portal se apaga.' : s.count ? 'Cabina libre.' : 'El portal está abierto. Llamá al primer viajero.',
      callNext: () => this.callNext(), cantCall: !!s.closing || !!s.stamp,
      talk: s.talk || [], hasChoices: !!(s.choices && s.choices.length), choices: (s.choices || []).map((c) => ({ ...c, go: () => this.choose(c.act) })),
      hasFinding: !!s.finding, findCls: s.finding ? s.finding.cls : '', findTitle: s.finding ? s.finding.title : '', findText: s.finding ? s.finding.text : '',
      hasCite: !!s.cite, cite: s.cite || {},
      todayStr: dstr(d), todaySel: C('hoy'), pickHoy: F('hoy'),
      hasPP: !!(t && t.docs), pp, ppFields, selPhoto: C('pp.foto'), pickPhoto: F('pp.foto'), selSeal: C('pp.sello'), pickSeal: F('pp.sello'),
      hasPE: !!(t && t.pe), pe: t && t.pe ? t.pe : {}, peFields,
      hasScan: !!(t && s.scanned), hasNote: !!s.note,
      showNoDocs: !t || !t.docs, noDocsMsg: !t ? 'Sin viajero en la cabina.' : t.special === 'supervisor' ? 'El supervisor no trae papeles: viene a hablar con vos.' : 'El viajero no trae ningún documento.',
      hasStamp: !!s.stamp, stampCls: s.stamp ? s.stamp.cls : '', stampTxt: s.stamp ? s.stamp.txt : '',
      rulesOpen: s.rulesOpen ? 'open' : '', toggleRules: () => this.setState({ rulesOpen: !s.rulesOpen }),
      tabs: tabsDef.map(([id, name, from]) => ({ name, cls: (s.ruleTab || 'reglas') === id ? 'on' : '', dot: from === d && from > 1 && !seen[id], go: () => this.setState({ ruleTab: id, seenTabs: { ...seen, [id]: 1 } }) })),
      tabReglas: (s.ruleTab || 'reglas') === 'reglas', tabEras: s.ruleTab === 'eras', tabProhib: s.ruleTab === 'prohib', tabBuscados: s.ruleTab === 'buscados',
      rulesList: RULES.filter((x) => x.d <= d).map((x) => ({ text: x.text, tag: x.d === d && d > 1 ? 'NUEVA HOY' : 'DÍA ' + x.d, cls: x.d === d && d > 1 ? 'new' : '' })),
      eraTable: ERAS.map((e) => ({ name: e.name, seal: sealSVG(e.shape, e.color), range: ystr(e.range[0]) + ' – ' + ystr(e.range[1]) })),
      prohib: PROHIB, wantedList: (s.wanted || []).map((w) => ({ face: w.face, name: w.name, cls: C('buscados'), go: F('buscados') })),
      canScan: d >= 4, scanOff: !t || !t.docs || !!s.scanned || !!s.stamp, doScan: () => this.doScan(),
      canDetain: d >= 5, decideOff,
      approve: () => this.decide('approve'), deny: () => this.decide('deny'), detain: () => this.decide('detain'),
      hasToast: !!s.toast, toast: s.toast,
      n, foodPay: !!s.foodPay, medPay: !!s.medPay, foodOff: n.base < 6, medOff: n.base - (s.foodPay ? 6 : 0) < 8,
      toggleFood: () => { if (n.base >= 6) this.setState({ foodPay: !s.foodPay }); },
      toggleMed: () => { if (n.base - (s.foodPay ? 6 : 0) >= 8) this.setState({ medPay: !s.medPay }); },
      famText, sleep: () => this.sleep(), sleepLabel: d >= 5 ? 'Dormir · Ver qué pasó' : 'Dormir · Ir al día ' + (d + 1),
      end: E, fin: s.fin || {}, endsFound: (s.ends || []).length
    };
  }
}
